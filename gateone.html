<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gateone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#eef1ed; --paper:#fbfaf7; --card:#ffffff; --ink:#101a17; --muted:#5c6863; --line:#dde3dd;
  --brass:#b8842e; --brass2:#e3b463; --teal:#0b5566; --teal2:#127a8f; --ok:#1b7a45; --bad:#b0342b;
  --r-sm:12px; --r-md:18px; --r-lg:28px; --r-xl:36px;
  --sh-1:0 1px 2px rgba(16,26,23,.06), 0 1px 1px rgba(16,26,23,.04);
  --sh-2:0 10px 30px -12px rgba(16,26,23,.22), 0 2px 8px rgba(16,26,23,.06);
  --sh-3:0 20px 48px -16px rgba(16,26,23,.28);
}
@media (prefers-color-scheme:dark){
  :root{--mist:#0e1513; --paper:#141c19; --card:#1a2320; --ink:#eef2ee; --muted:#93a099; --line:#2a332e;
        --brass:#e3b463; --brass2:#f2cd8c; --teal:#3fb7cc; --teal2:#5ecfe0; --ok:#63d18c; --bad:#f0837a;
        --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 10px 30px -12px rgba(0,0,0,.55); --sh-3:0 20px 48px -16px rgba(0,0,0,.6);}
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1100px 520px at 100% -8%, color-mix(in srgb, var(--teal) 10%, transparent), transparent 60%),
    var(--mist);
  color:var(--ink);
  font:500 18px/1.45 "Bricolage Grotesque","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-within{outline:3px solid var(--teal2);outline-offset:2px;border-radius:6px}
.ar{font-family:"Noto Sans Arabic","Bricolage Grotesque",system-ui,sans-serif}
.screen{min-height:100dvh;display:flex;flex-direction:column;padding:0 clamp(16px,3vw,36px) 28px}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0 18px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:-.01em}
.brand svg{width:36px;height:36px;filter:drop-shadow(var(--sh-1))}
.link{background:var(--card);border:1px solid var(--line);border-radius:99px;color:var(--muted);font-weight:700;padding:11px 20px;min-height:46px;box-shadow:var(--sh-1)}
.link:active{background:var(--mist)}

/* home */
.home{flex:1;display:flex;flex-direction:column;gap:26px;padding-top:6px}
.home h1{margin:0;font-size:clamp(32px,5vw,54px);line-height:1.06;font-weight:800;letter-spacing:-.03em}
.home h1 .ar{display:block;font-size:.48em;color:var(--muted);font-weight:500;margin-top:8px;letter-spacing:0}
.tiles{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,22px);min-height:44vh}
@media (max-aspect-ratio:1/1){.tiles{grid-template-columns:1fr}}
.tile{position:relative;overflow:hidden;border:0;border-radius:var(--r-xl);padding:clamp(24px,3vw,42px);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;transition:transform .15s ease,box-shadow .15s ease;box-shadow:var(--sh-2)}
.tile::after{content:'';position:absolute;inset:0;background:radial-gradient(420px 220px at 88% -10%, rgba(255,255,255,.35), transparent 60%);pointer-events:none}
.tile:active{transform:scale(.982);box-shadow:var(--sh-1)}
.tile svg{width:clamp(64px,10vw,112px);height:auto;position:relative;filter:drop-shadow(0 6px 14px rgba(0,0,0,.12))}
.tile .t{display:block;font-size:clamp(40px,7vw,76px);line-height:1;font-weight:800;letter-spacing:-.035em;position:relative}
.tile .a{display:block;font-size:clamp(22px,2.8vw,32px);margin-top:8px;font-weight:700;position:relative;opacity:.92}
.tile.delivery{background:linear-gradient(155deg,var(--brass2),var(--brass) 78%);color:#241605}
.tile.visitor{background:linear-gradient(155deg,var(--teal2),var(--teal) 78%);color:#ecfbff}
.leaverow{margin-top:2px}
.leaverow .btn{width:100%;min-height:64px;font-size:18px;display:flex;justify-content:space-between;align-items:center;border-radius:var(--r-md)}
.leaverow .count{background:var(--ink);color:var(--paper);border-radius:99px;padding:5px 16px;font-weight:800;font-size:15px}

/* flow screens */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.head h2{margin:0;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.025em;line-height:1.12}
.head h2 .ar{display:block;font-size:.48em;color:var(--muted);font-weight:500;margin-top:4px;letter-spacing:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:14px 22px;font-weight:700;min-height:52px;box-shadow:var(--sh-1);transition:transform .1s ease}
.btn:active{transform:scale(.98);box-shadow:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.big{min-height:70px;font-size:21px;padding:16px 30px;border-radius:var(--r-md)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:0 0 28px;padding:0;list-style:none}
.steps li{border-top:5px solid var(--line);padding-top:9px;font-size:14px;color:var(--muted);font-weight:700;border-radius:3px}
.steps li.done{border-color:var(--teal)}
.steps li.now{border-color:var(--ink);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pick{min-height:104px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:800;letter-spacing:-.01em;box-shadow:var(--sh-1);transition:transform .1s ease}
.pick:active{background:linear-gradient(155deg,var(--brass2),var(--brass));color:#241605;border-color:transparent;transform:scale(.98)}

.villa{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:start}
@media (max-width:820px){.villa{grid-template-columns:1fr}}
.label{font-size:15px;font-weight:700;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:11px}
.chip{width:80px;height:80px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-size:34px;font-weight:800;box-shadow:var(--sh-1)}
.chip[aria-pressed="true"]{background:linear-gradient(155deg,var(--teal2),var(--teal));border-color:transparent;color:#ecfbff}
.display{height:88px;border-radius:var(--r-md);background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;letter-spacing:.08em;margin-bottom:14px;box-shadow:inset 0 1px 3px rgba(0,0,0,.05)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.pad button{height:76px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-size:30px;font-weight:800;box-shadow:var(--sh-1)}
.pad button:active{background:linear-gradient(155deg,var(--brass2),var(--brass));color:#241605}
.pad .fn{font-size:18px;color:var(--muted)}

.cam{position:relative;background:#0a1210;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/10;max-width:940px;width:100%;box-shadow:var(--sh-2)}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.frame{position:absolute;inset:10% 7%;border:3px dashed rgba(255,255,255,.85);border-radius:16px;pointer-events:none}
.camMsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:20px}
.scanrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px;max-width:940px}
.scanrow .btn{flex:1;min-width:180px;text-align:center}
.note{margin-top:14px;min-height:26px;font-weight:700}
.note.bad{color:var(--bad)}
.hint{color:var(--muted);margin:0 0 16px;max-width:60ch}

.recentbox{margin:0 0 20px;max-width:940px}
.rec{border:1px solid var(--line);background:var(--card);border-radius:var(--r-md);padding:10px 18px;text-align:left;min-height:62px;box-shadow:var(--sh-1)}
.rec b{display:block;font-size:18px;line-height:1.25}
.rec span{font-size:13px;color:var(--muted);font-weight:600}
.rec:active{background:linear-gradient(155deg,var(--brass2),var(--brass));border-color:transparent;color:#241605}

.confirm{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:1000px}
@media (max-width:820px){.confirm{grid-template-columns:1fr}}
.field{margin-bottom:16px}
.field label{display:block;font-size:15px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field input{width:100%;height:60px;padding:0 16px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);font:inherit;font-size:22px;font-weight:700;color:var(--ink);box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
.field input[dir="rtl"]{font-size:26px}
.summary{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;align-self:start;box-shadow:var(--sh-2)}
.tag{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:800;font-size:15px}
.tag.delivery{background:linear-gradient(155deg,var(--brass2),var(--brass));color:#241605}
.tag.visitor{background:linear-gradient(155deg,var(--teal2),var(--teal));color:#ecfbff}
.summary .where{font-size:36px;font-weight:800;letter-spacing:-.02em;margin:12px 0 4px;line-height:1.15}
.warn{color:#8a5a00;font-weight:700;margin:0 0 14px}
.privacy{font-size:14px;color:var(--muted);margin-top:14px}

.done{flex:1;display:grid;place-content:center;justify-items:center;text-align:center;gap:14px}
.done .ring{width:140px;height:140px;border-radius:50%;background:linear-gradient(155deg,#3fcf8e,var(--ok));display:grid;place-items:center;box-shadow:var(--sh-2)}
.done .ring svg{width:74px;height:74px}
.done h2{margin:0;font-size:clamp(38px,6vw,62px);font-weight:800;letter-spacing:-.03em}
.done p{margin:0;font-size:24px;color:var(--muted);font-weight:700}
.countdown{width:min(340px,70vw);height:5px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:14px}
.countdown i{display:block;height:100%;background:var(--ink);width:100%;animation:drain 5s linear forwards;transform-origin:left}
@keyframes drain{to{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){.countdown i{animation:none}}
.done.denied .ring{background:linear-gradient(155deg,#e17469,var(--bad))}

.pinwrap{max-width:400px;margin:0 auto;width:100%}
.dots{display:flex;justify-content:center;gap:16px;margin:8px 0 26px}
.dots i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink)}
.dots i.on{background:var(--ink)}

/* dashboard */
.dash{max-width:1120px;margin:0 auto;width:100%}
.dash .top{padding-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--card);box-shadow:var(--sh-1)}
.seg button{border:0;background:none;padding:10px 20px;font-weight:700;min-height:46px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);margin:24px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{padding:22px 22px}
.kpi:not(:first-child){border-left:1px solid var(--line)}
@media (max-width:820px){.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}}
.kpi b{display:block;font-size:clamp(30px,4vw,42px);line-height:1.08;font-weight:800;letter-spacing:-.02em;background:linear-gradient(155deg,var(--ink),color-mix(in srgb,var(--ink) 70%, var(--teal)));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi span{color:var(--muted);font-size:14px;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-bottom:22px;box-shadow:var(--sh-1)}
.panel h3{margin:0 0 14px;font-size:19px;font-weight:800}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.legend{display:flex;gap:18px;font-size:14px;color:var(--muted);font-weight:700;margin-bottom:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}
svg.chart text{font:600 12px "Bricolage Grotesque",system-ui,sans-serif;fill:var(--muted)}
.bar{display:grid;grid-template-columns:92px 1fr 38px;align-items:center;gap:10px;margin:11px 0;font-weight:700}
.bar div{height:14px;background:var(--mist);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass2),var(--brass));border-radius:8px}
.bar b{text-align:right}
.empty{color:var(--muted);font-weight:600;padding:8px 0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:13px;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.gone{color:var(--muted);font-style:italic}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px}
@media (max-width:820px){.settings{grid-template-columns:1fr}}
.settings .field{margin:0}
.settings input,.settings select{height:50px;font-size:17px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--paper);padding:0 12px;width:100%;font:inherit;font-weight:600;color:var(--ink)}
.settings textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font:inherit;font-weight:600;background:var(--paper);color:var(--ink)}
.settings .full{grid-column:1/-1}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.actions .btn{min-height:48px;padding:10px 18px}
.actions .danger{color:var(--bad);border-color:var(--bad)}
.small{font-size:13px;color:var(--muted);margin:8px 0 0}
a.btn{display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.btn.out{background:var(--ink);border-color:var(--ink);color:var(--paper);min-width:112px;min-height:60px;font-size:20px}
.inrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 18px;box-shadow:var(--sh-1)}
.inrow.over{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.inrow .who{font-size:22px;font-weight:800;line-height:1.2}
.inrow .meta{color:var(--muted);font-weight:600;font-size:15px}
.inrow .flag{color:var(--bad);font-weight:800}
.inlist{display:grid;gap:12px;max-width:900px}
.result{display:grid;gap:12px;max-width:560px}
.result .btn{min-height:78px;font-size:22px}
.btn.yes{background:linear-gradient(155deg,#3fcf8e,var(--ok));border-color:transparent;color:#06210f}
.btn.no{background:linear-gradient(155deg,#e17469,var(--bad));border-color:transparent;color:#280604}
.strip{margin:0 0 22px;font-weight:600;color:var(--muted)}
.strip b{color:var(--ink)}

</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
/* =========================================================
   Gateone: gate log for villa communities
   Data layer: right now everything is saved on this tablet
   (localStorage). To move to a real backend (Supabase), only
   load() and save() below need to change.
   ========================================================= */
const KEY = 'gateone_v1';
const OWNER_CODE = 'gateone-2026';   // placeholder: only the Gateone owner should know it. Real enforcement comes with the backend.
const DEF = {
  settings: {
    community: 'Main Gate', retention: 14, pin: '1234',
    companies: ['Talabat', 'Noon', 'Amazon', 'Careem', 'Deliveroo', 'Keeta', 'Other'],
    sections: ['A', 'B', 'C', 'D', 'E', 'F'],
    plan: 'basic', approval: false, trackDeliveryExit: false, overstayMin: 60, assumeLeftHours: 12, directory: {}
  },
  events: []
};
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.settings) return { settings: { ...DEF.settings, ...d.settings }, events: d.events || [] };
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEF));
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
let db = load();

/* Personal details (name, ID) are erased after the retention period.
   The anonymous row (time, type, company, villa) stays so the dashboard keeps its history. */
function purge() {
  const now = Date.now(), cut = now - db.settings.retention * 864e5, oldest = now - Math.max(365, db.settings.retention) * 864e5;
  let n = 0;
  db.events = db.events.filter(e => e.ts > oldest);
  for (const e of db.events) {
    if (!e.anon && e.ts < cut) { e.nameEn = e.nameAr = e.idn = ''; e.anon = true; n++; }
  }
  if (n) save();
  return n;
}
purge();
setInterval(purge, 3600e3);

/* ---------- state ---------- */
const S = {
  screen: 'home', type: null, company: '', section: '', villa: '',
  rec: { nameEn: '', nameAr: '', idn: '' }, scanSide: 'back', msg: '',
  range: 7, pin: '', pinErr: false, inTab: 'all', lastDenied: false
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let stream = null, busy = false, doneT = null;
const workers = {};

/* ---------- icons ---------- */
const I = {
  logo: '<svg viewBox="0 0 40 40" fill="none"><rect x="2" y="2" width="36" height="36" rx="11" fill="#13263a"/><path d="M11 30V16a9 9 0 0 1 18 0v14M11 30h18M20 16v14" stroke="#f4ae00" stroke-width="3" stroke-linecap="round"/></svg>',
  box: '<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"><path d="M60 12 105 34v52L60 108 15 86V34z"/><path d="M15 34 60 56l45-22M60 56v52"/><path d="M38 23l45 22"/></svg>',
  person: '<svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"><circle cx="60" cy="36" r="20"/><path d="M20 108c0-24 18-38 40-38s40 14 40 38"/></svg>',
  check: '<svg viewBox="0 0 80 80" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="m16 42 17 17 31-38"/></svg>',
  cross: '<svg viewBox="0 0 80 80" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"><path d="M22 22l36 36M58 22 22 58"/></svg>'
};

/* ---------- navigation ---------- */
function go(screen) {
  stopCam(); clearTimeout(doneT);
  S.screen = screen; render();
  if (screen === 'scan') { startCam(); getWorker('mrz').catch(() => {}); }
  if (screen === 'done') doneT = setTimeout(() => go('home'), 5000);
}
let lastScreen = '';
function render() { $('#app').innerHTML = VIEWS[S.screen](); if (S.screen !== lastScreen) window.scrollTo(0, 0); lastScreen = S.screen; }

/* ---------- views ---------- */
function stepper(n) {
  const first = S.type === 'delivery' ? 'Company' : 'Villa';
  return '<ol class="steps">' + [first, 'Scan ID', 'Confirm'].concat(needsApproval() ? ['Resident'] : []).map((t, i) =>
    `<li class="${i + 1 < n ? 'done' : i + 1 === n ? 'now' : ''}">${t}</li>`).join('') + '</ol>';
}
function flowHead(title, ar, backAct, cancel) {
  return `<div class="head"><h2>${title}<span class="ar" lang="ar" dir="rtl">${ar}</span></h2>
    <div style="display:flex;gap:10px">${backAct ? `<button class="btn" data-act="${backAct}">Back</button>` : ''}<button class="btn" data-act="home">${cancel || 'Cancel'}</button></div></div>`;
}
function topbar() {
  return `<header class="top"><div class="brand">${I.logo}<span>${esc(db.settings.community)}</span></div>
    <button class="link" data-act="manager">Manager</button></header>`;
}
function keypad() {
  const k = n => `<button data-act="key" data-arg="${n}">${n}</button>`;
  return `<div class="pad">${[1,2,3,4,5,6,7,8,9].map(k).join('')}
    <button class="fn" data-act="key" data-arg="clear">Clear</button>${k(0)}<button class="fn" data-act="key" data-arg="del" aria-label="Delete last digit">Del</button></div>`;
}

const VIEWS = {
  home() {
    return `<div class="screen">${topbar()}
      <main class="home">
        <h1>Who is arriving?<span class="ar" lang="ar" dir="rtl">من القادم؟</span></h1>

/* ---------- helpers ---------- */
function fmtId(d) { d = String(d || ''); return /^\d{15}$/.test(d) ? `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7,14)}-${d.slice(14)}` : d; }
function maskId(d) { return d && d.length >= 4 ? '•••• ' + d.slice(-4) : ''; }
const hlab = x => { x = ((x % 24) + 24) % 24; return (x % 12 || 12) + (x < 12 ? ' am' : ' pm'); };
function whereOf(e) { return e.type === 'delivery' ? (e.company || 'Delivery') : `Villa ${e.section || ''}${e.section && e.villa ? '-' : ''}${e.villa || ''}`; }

const isPremium = () => db.settings.plan === 'premium';
const villaKey = (sec, v) => ((sec || '') + (sec && v ? '-' : '') + (v || '')).toUpperCase();
function normPhone(p) {
  let d = String(p || '').replace(/\D/g, '');
  if (/^00/.test(d)) d = d.slice(2);
  else if (/^0\d{9}$/.test(d)) d = '971' + d.slice(1);
  return d;
}
function fmtDur(ms) { const m = Math.max(1, Math.round(ms / 60000)); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }
function isInside(e) {
  if (e.outAt || e.approval === 'denied') return false;
  if (e.type === 'delivery' && !db.settings.trackDeliveryExit) return false;
  return Date.now() - e.ts < db.settings.assumeLeftHours * 3600e3;
}
function insideList() { return db.events.filter(isInside).sort((a, b) => a.ts - b.ts); }
function overstay(e) { return e.type === 'delivery' && Date.now() - e.ts > db.settings.overstayMin * 60000; }
function leftCell(e) {
  if (e.approval === 'denied') return 'Refused';
  if (e.outAt) return new Date(e.outAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return isInside(e) ? '<b>Inside</b>' : '–';
}
function approvalLabel(e) { return ({ approved: 'Approved', denied: 'Refused', no_answer: 'No answer' })[e.approval] || '–'; }
/* people who came before (details still stored): same company for deliveries, same villa for visitors */
function recents() {
  const seen = new Set(), out = [];
  for (const e of db.events.slice().sort((a, b) => b.ts - a.ts)) {
    if (e.anon || !e.idn || e.type !== S.type) continue;
    if (S.type === 'delivery' && e.company !== S.company) continue;
    if (S.type === 'visitor' && (e.section !== S.section || e.villa !== S.villa)) continue;
    if (seen.has(e.idn)) continue;
    seen.add(e.idn); out.push(e);
    if (out.length >= 6) break;
  }
  return out;
}
function recentHtml() {
  if (S.scanSide !== 'back' || !isPremium()) return '';
  const r = recents(); if (!r.length) return '';
  return `<div class="recentbox"><p class="label">${S.type === 'delivery' ? 'Been here before' : 'Seen at this villa before'} <span class="ar" lang="ar">زار من قبل</span></p>
    <div class="chips">${r.map(e => `<button class="rec" data-act="again" data-arg="${esc(e.id)}"><b>${esc(e.nameEn || 'No name')}</b><span>ID ending ${esc(e.idn.slice(-4))}</span></button>`).join('')}</div></div>`;
}

/* ---------- camera ---------- */
async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false
    });
    const v = $('#cam'); if (v) v.srcObject = stream;
  } catch (e) { const m = $('#camMsg'); if (m) m.hidden = false; }
}
function stopCam() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }

/* ---------- reading the card (runs on this device) ---------- */
function prep(src, w, h) {
  const max = 1800, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * s); c.height = Math.round(h * s);
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(src, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height), p = d.data, hist = new Uint32Array(256);
  for (let i = 0; i < p.length; i += 4) { const y = (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) | 0; p[i] = y; hist[y]++; }
  const total = c.width * c.height; let acc = 0, lo = 0, hi = 255;
  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > total * .02) { lo = i; break; } }
  acc = 0;
  for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > total * .02) { hi = i; break; } }
  const r = Math.max(1, hi - lo);
  for (let i = 0; i < p.length; i += 4) { const v = Math.max(0, Math.min(255, (p[i] - lo) * 255 / r)); p[i] = p[i + 1] = p[i + 2] = v; }
  g.putImageData(d, 0, 0);
  return c;
}
function wipe(c) { if (c) { c.getContext('2d').clearRect(0, 0, c.width, c.height); c.width = c.height = 1; } }

async function getWorker(kind) {
  if (typeof Tesseract === 'undefined') throw new Error('offline');
  if (workers[kind]) return workers[kind];
  const w = await Tesseract.createWorker(kind === 'mrz' ? 'eng' : 'eng+ara', 1, {
    logger: m => { if (m.status === 'recognizing text') note('Reading… ' + Math.round(m.progress * 100) + '%'); }
  });
  if (kind === 'mrz') await w.setParameters({ tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<', tessedit_pageseg_mode: '6' });
  workers[kind] = w; return w;
}
function note(t, bad) { const n = $('#note'); if (n) { n.textContent = t; n.className = 'note' + (bad ? ' bad' : ''); } }
function setBusy(b) { document.querySelectorAll('#snap').forEach(x => x.disabled = b); }

function parseBack(text) {
  const lines = text.split('\n').map(l => l.replace(/\s+/g, '').toUpperCase()).filter(l => l.length >= 15);
  let idn = '', nameEn = '';
  for (const l of lines) { const m = l.replace(/O/g, '0').replace(/[IL]/g, '1').match(/784\d{12}/); if (!idn && m) idn = m[0]; }
  let best = null;
  for (const l of lines) {
    if (!l.includes('<<')) continue;
    const dg = (l.match(/\d/g) || []).length;
    if (!best || dg < best.dg) best = { l, dg };
  }
  if (best) {
    const parts = best.l.replace(/<+$/, '').split('<<');
    const sur = (parts[0] || '').replace(/</g, ' ').trim(), giv = parts.slice(1).join(' ').replace(/</g, ' ').trim();
    nameEn = (giv + ' ' + sur).trim();
  }
  return { idn, nameEn, nameAr: '' };
}
function parseFront(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  let idn = '', nameEn = '', nameAr = '';
  const m = text.replace(/\n/g, ' ').match(/784[\s-]?\d{4}[\s-]?\d{7}[\s-]?\d/);
  if (m) idn = m[0].replace(/\D/g, '');
  for (const l of lines) {
    const e = l.match(/^name\s*[:\-]?\s*([A-Za-z][A-Za-z\s'.-]+)$/i);
    if (e && !nameEn) nameEn = e[1].trim().toUpperCase();
    if (l.includes('الاسم') && !nameAr) nameAr = l.replace(/.*الاسم\s*[:：]?/, '').trim();
  }
  if (!nameAr) {
    const ar = lines.filter(l => (l.match(/[\u0600-\u06FF]/g) || []).length >= 8);
    if (ar.length) nameAr = ar[0].replace(/[^\u0600-\u06FF\s]/g, '').trim();
  }
  return { idn, nameEn, nameAr };
}
function merge(r) {
  const w = [], d = (r.idn || '').replace(/\D/g, '');
  if (d) { if (S.rec.idn && S.rec.idn !== d) w.push('The ID number on this scan is different from the first scan. Please check it.'); else S.rec.idn = d; }
  if (r.nameEn && (S.scanSide === 'back' || !S.rec.nameEn)) S.rec.nameEn = r.nameEn;
  if (r.nameAr) S.rec.nameAr = r.nameAr;
  return w;
}

async function readCard(el, w, h) {
  if (busy) return;
  busy = true; setBusy(true);
  let c = null, moved = false;
  try {
    note('Loading reader… (first time can take a moment)');
    c = prep(el, w, h);
    const wk = await getWorker(S.scanSide === 'back' ? 'mrz' : 'front');
    note('Reading…');
    const { data } = await wk.recognize(c);
    const r = S.scanSide === 'back' ? parseBack(data.text) : parseFront(data.text);
    if (!(r.idn || r.nameEn || r.nameAr)) { note('Could not read the card. Move closer, avoid glare, and try again. Or type it instead.', true); return; }
    S.msg = merge(r).join(' ');
    moved = true; go('confirm');
  } catch (e) {
    note(e.message === 'offline' ? 'The reader needs internet the first time. Type the details instead.' : 'Could not read the card. Try again or type it instead.', true);
  } finally {
    wipe(c);                       // the photo is deleted here, always
    busy = false; if (!moved) setBusy(false);
  }
}

/* ---------- saving ---------- */
function needsApproval() { return S.type === 'visitor' && isPremium() && db.settings.approval; }
function validRec() {
  const r = S.rec;
  if (!r.nameEn.trim() && !r.idn.trim()) { S.msg = 'Enter a name or an ID number first.'; render(); return false; }
  return true;
}
function saveEntry(approval) {
  if (!validRec()) return;
  const r = S.rec, denied = approval === 'denied';
  db.events.push({
    id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()),
    ts: Date.now(), type: S.type, company: S.type === 'delivery' ? S.company : '',
    section: S.section, villa: S.villa,
    nameEn: r.nameEn.trim(), nameAr: (r.nameAr || '').trim(), idn: r.idn.replace(/[^0-9A-Za-z]/g, ''), anon: false,
    approval: approval || '', outAt: denied ? Date.now() : null
  });
  save(); S.lastDenied = denied; go('done');
}

/* ---------- actions ---------- */
function act(a, arg) {
  switch (a) {
    case 'start': S.type = arg; S.rec = { nameEn: '', nameAr: '', idn: '' }; S.company = ''; S.section = ''; S.villa = ''; S.msg = ''; S.scanSide = 'back'; go(arg === 'delivery' ? 'company' : 'villa'); break;
    case 'company': S.company = arg; go('scan'); break;
    case 'section': S.section = S.section === arg ? '' : arg; render(); break;
    case 'key': key(arg); break;
    case 'next': go('scan'); break;
    case 'snap': { const v = $('#cam'); if (!v || !v.videoWidth) { note('Camera is not ready. Use “Choose photo” or type it.', true); break; } readCard(v, v.videoWidth, v.videoHeight); break; }
    case 'typeit': S.msg = ''; go('confirm'); break;
    case 'front': S.scanSide = 'front'; go('scan'); break;
    case 'toCompany': go('company'); break;
    case 'toVilla': go('villa'); break;
    case 'toScan': S.scanSide = 'back'; go('scan'); break;
    case 'save': if (needsApproval()) { if (validRec()) go('approval'); } else saveEntry(''); break;
    case 'home': go('home'); break;
    case 'again': {
      const e = db.events.find(x => x.id === arg);
      if (e) { S.rec = { nameEn: e.nameEn, nameAr: e.nameAr || '', idn: e.idn }; S.msg = 'Returning ' + (S.type === 'delivery' ? 'driver' : 'visitor') + '. Check that the ID card matches this name.'; go('confirm'); }
      break;
    }
    case 'toConfirm': S.msg = ''; go('confirm'); break;
    case 'result': saveEntry(arg); break;
    case 'inside': S.inTab = 'all'; go('inside'); break;
    case 'intab': S.inTab = arg; render(); break;
    case 'out': { const e = db.events.find(x => x.id === arg); if (e) { e.outAt = Date.now(); save(); } render(); break; }
    case 'plan': {
      const code = prompt('Gateone owner code');
      if (code === null) break;
      if (code !== OWNER_CODE) { alert('Wrong code.'); break; }
      const next = isPremium() ? 'basic' : 'premium';
      db.settings.plan = next;
      if (next === 'basic') db.settings.approval = false;
      save(); render(); break;
    }
    case 'manager': S.pin = ''; S.pinErr = false; go('pin'); break;
    case 'range': S.range = +arg; render(); break;
    case 'demo': makeDemo(); render(); break;
    case 'rmdemo': db.events = db.events.filter(e => !e.demo); save(); render(); break;
    case 'purge': { const n = purge(); alert(n ? `Erased personal details from ${n} entries.` : 'Nothing to erase yet.'); render(); break; }
    case 'csv': exportCsv(); break;
    case 'clear': if (confirm('Delete ALL entries and history? This cannot be undone.')) { db.events = []; save(); render(); } break;
  }
}
function key(k) {
  if (S.screen === 'villa') {
    if (k === 'clear') S.villa = ''; else if (k === 'del') S.villa = S.villa.slice(0, -1); else if (S.villa.length < 3) S.villa += k;
    render();
  } else if (S.screen === 'pin') {
    if (k === 'clear') S.pin = ''; else if (k === 'del') S.pin = S.pin.slice(0, -1); else if (S.pin.length < 4) S.pin += k;
    S.pinErr = false;
    if (S.pin.length === 4) { if (S.pin === db.settings.pin) { S.pin = ''; go('dash'); return; } S.pin = ''; S.pinErr = true; }
    render();
  }
}
function setSetting(k, v) {
  const s = db.settings;
  if (k === 'community') s.community = v.trim() || 'Main Gate';
  if (k === 'retention') {
    const n = Math.min(365, Math.max(1, Math.round(+v) || 14));
    if (n > 14 && n > s.retention && !confirm('Keeping names and ID numbers longer than 14 days means you are responsible for protecting them. Continue?')) { render(); return; }
    s.retention = n; purge();
  }
  if (k === 'pin') { if (/^\d{4}$/.test(v)) s.pin = v; else alert('The PIN must be exactly 4 digits.'); }
  if (k === 'companies') s.companies = v.split(',').map(x => x.trim()).filter(Boolean);
  if (k === 'sections') s.sections = v.split(',').map(x => x.trim()).filter(Boolean);
  if (k === 'approval') s.approval = isPremium() && v === 'on';
  if (k === 'trackDeliveryExit') s.trackDeliveryExit = v === 'on';
  if (k === 'overstayMin') s.overstayMin = Math.max(5, +v || 60);
  if (k === 'assumeLeftHours') s.assumeLeftHours = Math.max(1, +v || 12);
  if (k === 'directory') {
    const m = {};
    v.split('\n').forEach(l => { const p = l.split(/[,\t]/); if (p.length < 2) return; const key = p[0].trim().toUpperCase().replace(/\s+/g, ''), ph = p.slice(1).join('').trim(); if (key && ph) m[key] = ph; });
    s.directory = m;
  }
  save(); render();
}

document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) act(b.dataset.act, b.dataset.arg); });
document.addEventListener('input', e => {
  const i = e.target.closest('[data-in]'); if (!i) return;
  S.rec[i.dataset.in] = i.dataset.in === 'idn' ? i.value.replace(/[^0-9A-Za-z]/g, '') : i.value;
});
document.addEventListener('change', async e => {
  const s = e.target.closest('[data-set]'); if (s) { setSetting(s.dataset.set, s.value); return; }
  if (e.target.id === 'file' && e.target.files[0]) {
    const f = e.target.files[0]; e.target.value = '';
    const bmp = await createImageBitmap(f); await readCard(bmp, bmp.width, bmp.height); bmp.close();
  }
});

    <div class="seg" role="group" aria-label="Time range">

      <div class="kpi"><b>${busy >= 0 ? hlab(busy) : '–'}</b><span>Busiest hour${busy >= 0 ? ` (${maxH} entries)` : ''}</span></div>

    <div class="two">
      <div class="panel"><h3>Traffic by hour</h3>

        ${ev.length ? hourChart(ev) : '<p class="empty">No entries in this period yet.</p>'}</div>
      <div class="panel"><h3>Deliveries by company</h3>
        ${cos.length ? cos.map(([n, c]) => `<div class="bar"><span>${esc(n)}</span><div><i style="width:${c / cos[0][1] * 100}%"></i></div><b>${c}</b></div>`).join('') : '<p class="empty">No deliveries in this period yet.</p>'}</div>
    </div>

    <div class="panel"><h3>Latest entries</h3>
      ${ev.length ? `<div class="tablewrap"><table><thead><tr><th>Time</th><th>Type</th><th>Company / villa</th><th>Name</th><th>ID</th><th>Left</th>${isPremium() ? '<th>Resident</th>' : ''}</tr></thead><tbody>
        ${ev.slice().sort((a, b) => b.ts - a.ts).slice(0, 30).map(e => `<tr>

          <td>${e.type === 'delivery' ? 'Delivery' : 'Visitor'}</td><td>${esc(whereOf(e))}</td>
          ${e.anon ? '<td class="gone" colspan="2">Details erased after ' + s.retention + ' days</td>' : `<td>${esc(e.nameEn)}${e.nameAr ? ' / <span class="ar" dir="rtl">' + esc(e.nameAr) + '</span>' : ''}</td><td>${esc(maskId(e.idn))}</td>`}
        <td>${leftCell(e)}</td>${isPremium() ? `<td>${approvalLabel(e)}</td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<p class="empty">Nothing yet. Add demo data below to preview the dashboard.</p>'}

          <p class="small">These are residents' personal numbers. They stay until you remove them. Start with 05 or the country code.</p></div>` : `<div class="field full"><p class="small"><b>Premium adds</b> returning drivers and resident approval. Ask Gateone to upgrade this gate.</p></div>`}
      </div>
      <p class="small">Only the anonymous counts stay after the erase period: time, company, and villa. Names and ID numbers are removed.</p>
      <div class="actions">
        <button class="btn" data-act="csv">Export CSV</button>

function hourChart(ev) {
  const d = Array(24).fill(0), v = Array(24).fill(0);
  ev.forEach(e => (e.type === 'delivery' ? d : v)[new Date(e.ts).getHours()]++);
  const max = Math.max(1, ...d.map((x, i) => x + v[i])), H = 150;
  let bars = '', lab = '';
  for (let h = 0; h < 24; h++) {
    const x = h * 30 + 4, dh = d[h] / max * H, vh = v[h] / max * H;
    bars += `<rect x="${x}" y="${H - vh}" width="22" height="${vh}" rx="3" fill="#0c5b71"/><rect x="${x}" y="${H - vh - dh}" width="22" height="${dh}" rx="3" fill="#f4ae00"/>`;
    if (h % 3 === 0) lab += `<text x="${x + 11}" y="${H + 20}" text-anchor="middle">${hlab(h)}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 720 ${H + 28}" width="100%" role="img" aria-label="Entries per hour of the day">${bars}${lab}</svg>`;
}

function exportCsv() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['time', 'type', 'company', 'section', 'villa', 'name_en', 'name_ar', 'id_number', 'left_at', 'resident_reply']]
    .concat(db.events.slice().sort((a, b) => a.ts - b.ts).map(e => [new Date(e.ts).toISOString(), e.type, e.company, e.section, e.villa, e.nameEn, e.nameAr, e.idn, e.outAt ? new Date(e.outAt).toISOString() : '', e.approval]));
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(q).join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gateone-entries.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- demo data (fake people) so the dashboard can be shown ---------- */
function makeDemo() {
  const first = ['Ahmed', 'Omar', 'Sara', 'Khalid', 'Fatima', 'Yusuf', 'Layla', 'Hassan', 'Noor', 'Ali', 'Mariam', 'Zayed', 'Rashid', 'Huda', 'Tariq'];
  const last = ['Al Mansoori', 'Khan', 'Hussain', 'Al Nuaimi', 'Ahmed', 'Rahman', 'Ali', 'Al Suwaidi', 'Sharma', 'Ibrahim'];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const wpick = w => { let t = w.reduce((x, y) => x + y, 0) * Math.random(); for (let i = 0; i < w.length; i++) { t -= w[i]; if (t <= 0) return i; } return 0; };
  const hd = [0, 0, 0, 0, 0, 0, 1, 2, 4, 6, 8, 12, 14, 12, 8, 6, 7, 9, 12, 14, 13, 8, 3, 1];
  const hv = [0, 0, 0, 0, 0, 0, 0, 1, 2, 3, 4, 5, 6, 6, 5, 7, 10, 14, 15, 14, 10, 5, 2, 0];
  const cos = db.settings.companies.filter(c => c !== 'Other'), cw = [30, 24, 20, 10, 9, 7, 5];
  const secs = db.settings.sections.length ? db.settings.sections : [''];
  const rid = () => '784' + Array.from({ length: 12 }, () => Math.floor(Math.random() * 10)).join('');
  const person = () => ({ n: (pick(first) + ' ' + pick(last)).toUpperCase(), id: rid() });
  const crew = {}; cos.forEach(c => { crew[c] = Array.from({ length: 6 }, person); });   // regular drivers, so repeats show up
  for (let d = 13; d >= 0; d--) {
    const day = new Date(); day.setHours(0, 0, 0, 0); day.setDate(day.getDate() - d);
    const dow = day.getDay(), wk = (dow === 5 || dow === 6);
    const nd = Math.round(rnd(70, 125) * (dow === 5 ? 1.2 : 1)), nv = Math.round(rnd(25, 55) * (wk ? 1.6 : 1));
    const add = (type, h) => {
      const ts = new Date(day).setHours(h, Math.floor(rnd(0, 60)), Math.floor(rnd(0, 60)));
      if (ts > Date.now()) return;
      const co = type === 'delivery' ? (cos[wpick(cw.slice(0, cos.length))] || 'Other') : '';
      const p = type === 'delivery' && crew[co] ? pick(crew[co]) : person();
      let outAt = ts + (type === 'delivery' ? rnd(3, 12) : rnd(40, 240)) * 60000;
      if (outAt > Date.now()) outAt = Math.random() < 0.6 ? null : Date.now() - 1000;
      let approval = '';
      if (type === 'visitor' && db.settings.approval) { const r = Math.random(); approval = r < 0.9 ? 'approved' : r < 0.94 ? 'denied' : 'no_answer'; }
      if (approval === 'denied') outAt = ts;
      db.events.push({
        id: 'demo' + ts + Math.random(), ts, type, demo: true, company: co,
        section: type === 'visitor' ? pick(secs) : '', villa: type === 'visitor' ? String(1 + Math.floor(Math.random() * 60)) : '',
        nameEn: p.n, nameAr: '', idn: p.id, anon: false, approval, outAt
      });
    };
    for (let i = 0; i < nd; i++) add('delivery', wpick(hd));
    for (let i = 0; i < nv; i++) add('visitor', wpick(hv));
  }
  save(); purge();
}
